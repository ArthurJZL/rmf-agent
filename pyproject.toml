[project]
name = "rmf-agent"
version = "0.1.0"
description = "A Cohere tool-use agent, MCP server and evaluation harness for diagnosing Open-RMF robot fleets, with guarded writes."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Arthur Jin" }]
requires-python = ">=3.11,<3.13"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "cohere>=7.3,<8",
  "fastmcp>=4.2,<4.3",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
]

[project.scripts]
rmf-agent = "rmf_agent.cli:main"
rmf-agent-mcp = "rmf_agent.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rmf_agent"]

[tool.hatch.build.targets.sdist]
include = ["rmf_agent", "eval", "tests", "docs", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/rmf_web_models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Emitted inside the cohere SDK, not by this project.
filterwarnings = ["ignore:The `__fields__` attribute is deprecated:DeprecationWarning"]
